known_issues:
  - "Hermes has no public Kanban API for plugins yet: pinning a card to a model, unblocking it and reading boards go through hermes_cli.kanban_db. All private imports live in one file, _core.py; if a Hermes update removes one, the plugin stays loaded, registers no hooks and 'hermes calling-mom doctor' names the cause."
  - "Advice on a tool result arrives after the tool ran: it warns, it cannot prevent a command. The one exception is pre-flight, which asks Mom before a critical command and can block it; it fails open (a timeout, a down provider or a cap lets the command run)."
  - "The risk list is pattern based; an unusual command or secret format can pass."
  - "Card badges in Hermes Desktop need the Desktop app 0.22.6 or later (KANBAN_CARD_AREAS.badges); on 0.22.5 the page loads without badges. The agent half runs on 0.22."
  - "When the Desktop app connects to a gateway on another machine, the Desktop half has to be installed on the machine that runs the app (README, \"Desktop on another machine\"); the Desktop app loads Desktop plugins from its own disk only."
