version: "1.4.1"
title: Calling Mom
description: "Lets a cheap model run your Kanban board and climbs a ladder only where the board or the tool results show it is needed: worker, Mom (a good, affordable model), Olymp (the expensive heavyweight, rare and capped), and you. Mom answers stuck signals, checks a critical command before it runs, answers worker questions, and checks completion; what only a person should decide reaches you as a short brief. Disclosure — once enabled, the plugin observes every kanban worker tool result (hashes, counts, tool names and token numbers only, logged to logs/calling-mom.jsonl). With the advisor enabled AND a board or card opted in, redacted run excerpts go through Hermes's ctx.llm to the mom and olymp models you choose (never for [local-only] cards): run excerpts for advice, plus, new in 1.4, the card title, the first 800 characters of the card text and the command before a critical command (pre-flight), and the question, card text and last comments when answers are on. Results are written to the card with the public kanban_comment tool; a pre-flight HOLD blocks a critical command until a person allows it (a timeout, a down provider or a cap lets it run). With answer.enabled (off by default) Mom's ANSWER unblocks the card she answered; credentials, money, legal, personal data, publishing and critical commands only ever get a brief for a person. Your own answers to a brief are stored as local text (500 characters each, redacted) in logs/calling-mom-precedents.jsonl, listed and deleted with 'hermes calling-mom precedents'; answer.precedents switches it off. The Desktop half is a backend served by your own gateway (dashboard/plugin_api.py): read-only routes for the page, and one write, POST /answer, which writes a card comment and unblocks the card when you press a button. A card line verify: <command> runs an allowlisted command (no shell, scrubbed environment) for cards created by trusted creators. hermes calling-mom setup writes the plugin's own config (calling_mom.* and its plugins.entries allowlist) with the values you pick, reads delegation.backends.model_map (read-only, to offer your Advanced Delegation routes) and creates one cron job, 'calling-mom: sweep', unless you pass --no-cron; the sweep reads the kanban databases and may push metrics to Pushgateway URLs you configure (off by default). No telemetry, no credentials stored."
